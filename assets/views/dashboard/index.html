{% extends "layouts/app.html" %}

{% block meta_title %}Dashboard · Sagan{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Dashboard</h1>
<p class="mt-1 text-sm text-slate-600">Signed in as {{ user.name }}.</p>

<dl class="mt-6 grid max-w-2xl grid-cols-1 gap-4 sm:grid-cols-3">
  <div class="rounded-lg border border-slate-200 bg-white p-4">
    <dt class="text-xs font-medium tracking-wide text-slate-500 uppercase">Name</dt>
    <dd class="mt-1 text-sm font-medium">{{ user.name }}</dd>
  </div>
  <div class="rounded-lg border border-slate-200 bg-white p-4">
    <dt class="text-xs font-medium tracking-wide text-slate-500 uppercase">Email</dt>
    <dd class="mt-1 text-sm font-medium break-all">{{ user.email }}</dd>
  </div>
  <div class="rounded-lg border border-slate-200 bg-white p-4">
    <dt class="text-xs font-medium tracking-wide text-slate-500 uppercase">User ID</dt>
    <dd class="mt-1 text-sm font-medium break-all">{{ user.pid }}</dd>
  </div>
</dl>
{% endblock %}
