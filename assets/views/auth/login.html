{% extends "base.html" %}

{% block meta_title %}Sign in · Sagan{% endblock %}

{% block body %}
<div class="flex min-h-full items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-lg font-semibold">Sign in</h1>
    <p class="mt-1 text-sm text-slate-600">Use your Sagan account.</p>

    {% if error %}
    <p class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="mt-6 space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" value="{{ email }}"
               class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-slate-500 focus:outline-none" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-slate-500 focus:outline-none" />
      </div>
      <button type="submit"
              class="w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
