{% extends "base.html" %}

{% block body %}
<div class="flex min-h-full flex-col">
  <header class="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-6">
    <span class="text-lg font-semibold tracking-tight">Sagan</span>
    <div class="flex items-center gap-4">
      <div class="text-right leading-tight">
        <div class="text-sm font-medium">{{ user.name }}</div>
        <div class="text-xs text-slate-500">{{ user.email }}</div>
      </div>
      <form method="post" action="/logout">
        <button type="submit"
                class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Sign out</button>
      </form>
    </div>
  </header>

  <div class="flex flex-1">
    <aside class="w-60 shrink-0 border-r border-slate-200 bg-white p-4">
      <nav class="space-y-1">
        {% block nav %}
        <a href="/"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if active == "dashboard" %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50{% endif %}">Dashboard</a>
        <a href="/system"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if active == "system" %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50{% endif %}">System</a>
        <a href="/logs"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if active == "logs" %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50{% endif %}">Logs</a>
        <a href="/jobs"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if active == "jobs" %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50{% endif %}">Jobs</a>
        <a href="/configuration"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if active == "configuration" %}bg-slate-100 text-slate-900{% else %}text-slate-600 hover:bg-slate-50{% endif %}">Configuration</a>
        {% endblock %}
      </nav>
    </aside>

    <main class="flex-1 p-6">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
